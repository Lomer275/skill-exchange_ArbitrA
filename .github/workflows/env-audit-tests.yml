name: env-audit tests

on:
  push:
    paths:
      - "plugins/team-skills/skills/env-audit/**"
      - "tests/env_audit/**"
      - "requirements-dev.txt"
      - ".github/workflows/env-audit-tests.yml"
  pull_request:
    paths:
      - "plugins/team-skills/skills/env-audit/**"
      - "tests/env_audit/**"
      - "requirements-dev.txt"
      - ".github/workflows/env-audit-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        # tests/env_audit входит в общий прогон — отдельным шагом он гонялся бы дважды
        run: python -m pytest -q
